# Temporary (firn-handshake-client): runs summary.py's selftest once in CI and
# shows that it fails on three broken versions of the tool. Deleted before the
# PR is ready.
name: tmp-summary-selftest
on:
  push:
    branches: [claude/client-handshake]
jobs:
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The selftest passes on the tool as it is
        run: python3 -I research/experiments/redis-bench/summary.py selftest
      - name: The selftest fails on a tool that never calls a slowdown slower
        run: |
          python3 -I - <<'PY'
          import pathlib, subprocess, sys, tempfile
          source = pathlib.Path("research/experiments/redis-bench/summary.py").read_text()
          mutations = [
              ("if high < 1:", "if high < 0:"),
              ("rate_ok = multiple >= 1.0", "rate_ok = True"),
              ("p99_ok = limited or head_p99 <= best_p99", "p99_ok = True"),
          ]
          for old, new in mutations:
              assert source.count(old) == 1, old
              with tempfile.TemporaryDirectory() as tmp:
                  broken = pathlib.Path(tmp) / "summary.py"
                  broken.write_text(source.replace(old, new))
                  done = subprocess.run([sys.executable, "-I", str(broken), "selftest"], capture_output=True, text=True)
                  print(f"{old!r} -> {new!r}: exit {done.returncode}")
                  assert done.returncode != 0, "the selftest passed on a broken tool"
          PY
