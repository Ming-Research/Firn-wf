# Experiment only (branch exp/halo-gc-stats, never merged): measures the
# counted heap's growth per command for minimal commands and scripts on a
# GitHub-hosted runner. Memory, not timing, so it needs no 14900K.
name: leak-probe

on:
  push:
    branches: [exp/halo-gc-stats]
    paths: [research/experiments/leak-probe/**, .github/workflows/leak-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-tools
          make toolchain
      - name: Build firn
        run: make firn
      - name: Minimal replacement programs
        run: |
          W=$(ls -d build/whitefoot/*/whitefootc | head -1)
          for f in replace_local replace_field replace_slot_field; do
            "$W" research/experiments/leak-probe/$f.wf -o build/$f || { echo "$f: compile failed"; continue; }
            set +e; build/$f; code=$?; set -e
            echo "$f: exit $code (0: no growth; 11-13: grew by 8 or more bytes per replacement)" | tee -a leak-min.txt
          done
      - name: Probe
        run: sh research/experiments/leak-probe/leak-probe.sh build/firn leak-probe.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leak-probe
          path: |
            leak-probe.csv
            leak-min.txt
            /tmp/firn-*.log
