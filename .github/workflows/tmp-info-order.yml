# Temporary, board item firn-pubsub-info-order: shows that the INFO/EXEC
# ordering case fails on the code before the fix and passes on the fix. The
# "old" leg makes promoted INFO run the ordinary run_info, which is what the
# code before the fix did; the "new" leg is the control. Delete before the PR
# is ready.
name: tmp-info-order

on:
  push:
    branches: [claude/pubsub-info-order]

env:
  # The case under test, and how many times each leg runs it. Each run is
  # 200 rounds of INFO KEYSPACE against a concurrent EXEC.
  CASE: pubsub::resp3_info_keyspace_and_exec_publication
  RUNS: "20"

jobs:
  order:
    name: INFO order case, ${{ matrix.variant }} code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [old, new]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      # Replace the body of run_info_promoted by a call of run_info, the
      # ordinary INFO that released the key count before it formatted and
      # committed the reply. The signature and effects are unchanged.
      - name: Route promoted INFO as the code before the fix did
        if: matrix.variant == 'old'
        run: |
          python3 -I - <<'EOF'
          path = "firn/commands/info.wf"
          source = open(path).read()
          start = source.index("fn run_info_promoted(")
          end = source.index("const human_units")
          head = source[start:end].split("\n")[:2]
          body = "  run_info(store: store, input: input, args: args, client: client, time: time);\n  return unit;\n}\n\n"
          assert head[0].startswith("fn run_info_promoted(") and head[1].lstrip().startswith("doc ")
          open(path, "w").write(source[:start] + "\n".join(head) + "\n" + body + source[end:])
          EOF
          git diff --stat
          grep -n -A4 '^fn run_info_promoted' firn/commands/info.wf | cut -c1-160

      - name: Build firn for the network cases
        run: make firn-test

      - name: Run the case repeatedly
        run: |
          failures=0
          for run in $(seq 1 "$RUNS"); do
            status=0
            FIRN="$PWD/build/firn-test" cargo test --manifest-path tests/Cargo.toml --locked \
              --test network -- "$CASE" >"$RUNNER_TEMP/case-$run.log" 2>&1 || status=$?
            # A filter that selects no case also exits 0: stop on it.
            if ! grep -q 'running 1 test' "$RUNNER_TEMP/case-$run.log"; then
              echo "the filter selected no single case:"
              cat "$RUNNER_TEMP/case-$run.log"
              exit 2
            fi
            if [ $status -ne 0 ]; then
              failures=$((failures + 1))
              echo "run $run failed (exit $status):"
              grep -E -A3 'panicked' "$RUNNER_TEMP/case-$run.log" | cut -c1-400 | head -8
            fi
          done
          echo "variant=${{ matrix.variant }} failures=$failures of $RUNS runs"
          echo "variant=${{ matrix.variant }} failures=$failures of $RUNS runs" >> "$GITHUB_STEP_SUMMARY"
          # The old code must fail at least once, the fix never.
          if [ "${{ matrix.variant }}" = old ]; then
            [ "$failures" -ge 1 ]
          else
            [ "$failures" -eq 0 ]
          fi
