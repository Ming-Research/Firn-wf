# Temporary: runs the consistent-snapshot witnesses and prototype under
# research/experiments/ with the witness Whitefoot release below. Removed before
# any pull request.
name: snapshot-witnesses

on:
  push:
    branches: [claude/snapshot-witnesses]

jobs:
  witnesses:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The witnesses are standalone programs that do not build firn or Halo,
      # so they use the release named here rather than whitefoot.pin; firn's
      # own pin waits on Halo (status board firn-pin-v0121).
      - name: Install the host toolchain and the witness compiler
        env:
          WITNESS_RELEASE: wf-a3205af0bbea
        run: |
          echo "release = $WITNESS_RELEASE" > "$RUNNER_TEMP/witness.pin"
          make toolchain PIN="$RUNNER_TEMP/witness.pin"
          make compiler PIN="$RUNNER_TEMP/witness.pin"
          echo "WFC=$PWD/build/whitefoot/$WITNESS_RELEASE/whitefootc" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/witness.pin"
          uname -srvmo
          nproc

      - name: Run each witness
        run: |
          status=0
          for name in frozen-dataset-witness frozen-dataset-prototype frozen-dataset-library snapshot-log-witness; do
            echo "== $name"
            code=0
            OUT="$RUNNER_TEMP/$name" sh "research/experiments/$name/run.sh" || code=$?
            echo "== $name exit=$code"
            [ "$code" -eq 0 ] || status=1
          done
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-witnesses-${{ github.sha }}
          path: ${{ runner.temp }}/*/
          if-no-files-found: warn
