# Temporary quick workflow of firn-pubsub-bench: the tests of what the item
# changes, on every push of its branch. Deleted before the item merges.
name: tmp-pubsub-bench

on:
  push:
    branches: [firn-pubsub-bench]

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Host
        run: |
          nproc
          lscpu -e
          cargo --version

      - name: Unit tests of the workload client
        run: cargo test --locked --release --manifest-path research/experiments/redis-bench/workload/Cargo.toml

      - name: Script checks
        run: |
          sh -n research/experiments/redis-bench/redis-bench.sh
          sh research/experiments/redis-bench/redis-bench.sh placement-selftest
          python3 -I research/experiments/redis-bench/summary.py selftest

      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: |
          bin=$(tests/redis-suite/reference.sh)
          echo "REDIS_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/redis-server" --version

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: The client against Redis 7.2.16
        run: |
          set -e
          cargo build --locked --release --manifest-path research/experiments/redis-bench/workload/Cargo.toml --target-dir "$RUNNER_TEMP/target"
          client="$RUNNER_TEMP/target/release/firn-workload"
          "$REDIS_BIN/redis-server" --port 7001 --save "" --appendonly no --daemonize no >"$RUNNER_TEMP/redis.log" 2>&1 &
          redis=$!
          tries=0
          until "$REDIS_BIN/redis-cli" -p 7001 PING 2>/dev/null | grep -q PONG; do
            tries=$((tries + 1)); [ "$tries" -lt 100 ] || exit 1; sleep 0.1
          done
          for workload in pubsub-channel pubsub-pattern; do
            for depth in 16 1; do
              "$client" --port 7001 --workload "$workload" --connections 50 --pipeline "$depth" \
                --seconds 3 --warmup-seconds 1 --threads 3 --client-work-file "$RUNNER_TEMP/work" |
                tee -a "$RUNNER_TEMP/out.csv"
              cat "$RUNNER_TEMP/work"
            done
          done
          kill "$redis"
          # workload,connections,pipeline,published,delivered,seconds,rate,p50,p99
          awk -F, 'NF != 9 || $5 != $4 * 50 || $7 <= 0 || $9 < $8 { bad = 1; print "bad row: " $0 } END { exit bad }' "$RUNNER_TEMP/out.csv"
          [ "$(wc -l < "$RUNNER_TEMP/out.csv")" = 4 ]
          # A server without SUBSCRIBE is reported by exit status 3.
          cat > "$RUNNER_TEMP/fake.py" <<'EOF'
          import socket
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 7002))
          s.listen(5)
          c, _ = s.accept()
          c.recv(1024)
          c.sendall(b"-ERR unknown command 'SUBSCRIBE', with args beginning with: 'bench:ch' \r\n")
          c.close()
          EOF
          python3 -I "$RUNNER_TEMP/fake.py" &
          fake=$!
          sleep 0.5
          status=0
          "$client" --port 7002 --workload pubsub-channel --connections 5 --seconds 1 --warmup-seconds 0 || status=$?
          wait "$fake"
          [ "$status" = 3 ]
          # Not a pub/sub option
          status=0
          "$client" --port 7001 --workload session-get --seconds 1 --pipeline 4 || status=$?
          [ "$status" = 1 ]

      - name: The compare mode on the lrange tests, against Redis alone
        run: |
          set -e
          cpus=$(lscpu -p=CPU,CORE | awk -F, '!/^#/ { if (!($2 in seen)) { seen[$2] = $1; order[++n] = $2 } } END { print seen[order[1]] " " seen[order[2]] }')
          set -- $cpus
          echo "server CPU $1, client CPU $2"
          export PATH="$REDIS_BIN:$PATH"
          export OUT="$RUNNER_TEMP/bench"
          SERVER_CPU_LIST=$1 CLIENT_CPU_LIST=$2 COMPARE_REFERENCE=true \
            COMPARE_TESTS="spop lrange_100 lrange_600 set" COMPARE_DEPTHS="16 1" \
            COMPARE_CPUS=1 COMPARE_PASSES=2 COMPARE_SECONDS=1 PERF= \
            sh research/experiments/redis-bench/redis-bench.sh compare
          # line,pass,cpus,test,depth,requests,rps,us_per_request,p50,p99
          awk -F, 'NR > 1 && (NF != 10 || $7 <= 0) { bad = 1; print "bad row: " $0 } END { exit bad }' "$OUT/compare.csv"
          [ "$(wc -l < "$OUT/compare.csv")" = 17 ]

  profile-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the pinned release's LLVM and the compiler
        run: |
          sudo apt-get update
          make toolchain
          make compiler

      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: echo "REDIS_BIN=$(tests/redis-suite/reference.sh)" >> "$GITHUB_ENV"

      - name: The profile pass of the pub/sub workloads, with a stand-in for perf
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/stub" "$RUNNER_TEMP/bench"
          cat > "$RUNNER_TEMP/stub/perf" <<'EOF'
          #!/usr/bin/env python3
          import signal, sys, time
          if sys.argv[1] == "record":
              open(sys.argv[sys.argv.index("-o") + 1], "w").write("data\n")
              signal.signal(signal.SIGINT, lambda *args: sys.exit(0))
              time.sleep(600)
          elif sys.argv[1] == "report":
              print("# stub\n\n    42.00%  firn  [.] stub_symbol")
          EOF
          chmod +x "$RUNNER_TEMP/stub/perf"
          export PATH="$REDIS_BIN:$PATH" OUT="$RUNNER_TEMP/bench"
          PERF="$RUNNER_TEMP/stub/perf" SERVER_CPU_LIST=0 CLIENT_CPU_LIST=2,3 WORKLOAD_SERVERS=firn \
            WORKLOADS=pubsub-channel WORKLOAD_CPUS=1 WORKLOAD_PASSES=1 WORKLOAD_SECONDS=2 \
            WORKLOAD_DEPTHS="16 1" WORKLOAD_OPTIONS="--warmup-seconds 1" \
            sh research/experiments/redis-bench/redis-bench.sh workloads
          ls "$OUT"/profile-*.txt
          [ "$(ls "$OUT"/profile-*.txt | wc -l)" = 2 ]
          grep -q stub_symbol "$OUT/profile-firn-1-1-pubsub-channel-50-16.txt"
          [ "$(wc -l < "$OUT/pubsub.csv")" = 3 ]
