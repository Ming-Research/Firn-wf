# Temporary quick workflow of firn-pubsub-bench: the tests of what the item
# changes, on every push of its branch. Deleted before the item merges.
name: tmp-pubsub-bench

on:
  push:
    branches: [firn-pubsub-bench]

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Script checks
        run: |
          sh -n research/experiments/redis-bench/redis-bench.sh
          python3 -I research/experiments/redis-bench/summary.py selftest

  profile-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the pinned release's LLVM and the compiler
        run: |
          sudo apt-get update
          make toolchain
          make compiler

      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: echo "REDIS_BIN=$(tests/redis-suite/reference.sh)" >> "$GITHUB_ENV"

      - name: Fetch the newest competitor releases
        env:
          REDIS_BENCH_LATEST_CACHE: ${{ runner.temp }}/latest-cache
        run: |
          set -e
          research/experiments/redis-bench/latest.sh versions
          for project in redis valkey dragonfly garnet; do
            path=$(research/experiments/redis-bench/latest.sh "$project")
            # A second call finds it in the cache and builds nothing.
            [ "$(research/experiments/redis-bench/latest.sh "$project")" = "$path" ]
            { "$path" --version 2>&1 | head -2; } || true
            echo "$(echo "$project" | tr a-z A-Z)_LATEST=$path" >> "$GITHUB_ENV"
          done

      - name: Garnet runs on the kept .NET runtime
        run: |
          set -e
          "$GARNET_LATEST" --port 7003 --bind 127.0.0.1 > "$RUNNER_TEMP/garnet.log" 2>&1 &
          pid=$!
          tries=0
          until "$REDIS_BIN/redis-cli" -p 7003 PING 2>/dev/null | grep -q PONG; do
            tries=$((tries + 1)); [ "$tries" -lt 100 ] || { cat "$RUNNER_TEMP/garnet.log"; exit 1; }; sleep 0.1
          done
          # The process has mapped the runtime this script keeps, not the
          # runner's own.
          grep -o '[^ ]*dotnet-10.0.13[^ ]*libcoreclr.so' /proc/$pid/maps | head -1
          grep -q 'latest-cache/dotnet-10.0.13/' /proc/$pid/maps
          kill $pid

      - name: The pub/sub cells against the newest releases
        run: |
          set -e
          export PATH="$REDIS_BIN:$PATH"
          mkdir -p "$RUNNER_TEMP/newest"
          OUT="$RUNNER_TEMP/newest" SERVER_CPU_LIST=0 CLIENT_CPU_LIST=2,3 \
            WORKLOAD_SERVERS="reference redis-latest valkey-latest valkey-io-latest dragonfly-latest garnet-latest firn" \
            WORKLOADS=pubsub-channel WORKLOAD_CPUS=1 WORKLOAD_PASSES=1 WORKLOAD_SECONDS=2 \
            WORKLOAD_DEPTHS="16 1" WORKLOAD_OPTIONS="--warmup-seconds 1" \
            sh research/experiments/redis-bench/redis-bench.sh workloads
          cat "$RUNNER_TEMP/newest/pubsub.csv"
          # Seven lines at two depths, and the header.
          [ "$(wc -l < "$RUNNER_TEMP/newest/pubsub.csv")" = 15 ]
          for line in reference redis-latest valkey-latest valkey-io-latest dragonfly-latest-1 garnet-latest-1 firn-1; do
            grep -q "^$line," "$RUNNER_TEMP/newest/pubsub.csv"
          done
          python3 -I research/experiments/redis-bench/summary.py pubsub "$RUNNER_TEMP/newest"

      - name: The profile pass with a stand-in for perf that works, and with one whose report fails
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/stub"
          cat > "$RUNNER_TEMP/stub/perf" <<'EOF'
          #!/usr/bin/env python3
          import signal, sys, time
          if sys.argv[1] == "record":
              open(sys.argv[sys.argv.index("-o") + 1], "w").write("data\n")
              signal.signal(signal.SIGINT, lambda *args: sys.exit(0))
              time.sleep(600)
          elif sys.argv[1] == "report":
              print("# stub\n\n    42.00%  firn  [.] stub_symbol")
          EOF
          # The same stand-in, whose report and record fail as perf does when
          # the kernel forbids it.
          sed 's/open(sys.argv\[sys.argv.index("-o") + 1\], "w").write("data\\n")/sys.exit(1)/; s/print("# stub.*/sys.exit(1)/' \
            "$RUNNER_TEMP/stub/perf" > "$RUNNER_TEMP/stub/perf-fails"
          cat "$RUNNER_TEMP/stub/perf-fails"
          chmod +x "$RUNNER_TEMP/stub/perf" "$RUNNER_TEMP/stub/perf-fails"
          export PATH="$REDIS_BIN:$PATH"
          run() {
            OUT="$1" PERF="$2" SERVER_CPU_LIST=0 CLIENT_CPU_LIST=2,3 WORKLOAD_SERVERS=firn \
              WORKLOADS=pubsub-channel WORKLOAD_CPUS=1 WORKLOAD_PASSES=1 WORKLOAD_SECONDS=2 \
              WORKLOAD_DEPTHS="16 1" WORKLOAD_OPTIONS="--warmup-seconds 1" \
              sh research/experiments/redis-bench/redis-bench.sh workloads
          }
          mkdir -p "$RUNNER_TEMP/works" "$RUNNER_TEMP/fails"
          run "$RUNNER_TEMP/works" "$RUNNER_TEMP/stub/perf"
          [ "$(ls "$RUNNER_TEMP"/works/profile-*.txt | wc -l)" = 2 ]
          grep -q stub_symbol "$RUNNER_TEMP/works/profile-firn-1-1-pubsub-channel-50-16.txt"
          [ "$(wc -l < "$RUNNER_TEMP/works/pubsub.csv")" = 3 ]
          run "$RUNNER_TEMP/fails" "$RUNNER_TEMP/stub/perf-fails" | tee "$RUNNER_TEMP/fails.out"
          [ "$(wc -l < "$RUNNER_TEMP/fails/pubsub.csv")" = 3 ]
          [ "$(grep -c '^skip,profile,' "$RUNNER_TEMP/fails.out")" -ge 2 ]
          ! ls "$RUNNER_TEMP"/fails/profile-*.txt 2>/dev/null
