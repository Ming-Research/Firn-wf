# Temporary, on branch claude/blocking-lists only (removed before the branch is
# ready): records Redis 7.2.16's replies and incremental AOF bytes for list
# writes while a blocked client waits on a key that holds a string
# (firn-scope-blocking-lists).
name: tmp-oracle-narrow
on:
  push:
    branches: [claude/blocking-lists]
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Redis build
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: echo "BIN=$(tests/redis-suite/reference.sh)" >> "$GITHUB_ENV"
      - name: Record replies and AOF bytes
        run: python3 -I tmp-oracle/record.py "$BIN/redis-server"
      - uses: actions/upload-artifact@v4
        with:
          name: tmp-oracle-record
          path: tmp-oracle-record.json
