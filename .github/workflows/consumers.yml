# The deployment milestone's consumers (research/investigations/consumers/):
# each consumer's own Redis tests run against Redis 7.2.16, the reference of
# AGENTS.md built from its release archive by tests/redis-suite/reference.sh,
# recording the commands they send, and against firn built at this revision.
# Dispatched by hand, and weekly so a change that breaks a consumer is seen
# within a week; an investigation copies the results it relies on into its
# record.
name: consumers

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

defaults:
  run:
    shell: bash

jobs:
  run:
    name: ${{ matrix.consumer }} against ${{ matrix.server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    strategy:
      fail-fast: false
      matrix:
        consumer: [django, connect-redis, rate-limiter-flexible]
        server: [redis, firn]
    steps:
      - uses: actions/checkout@v4

      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit deps/halo-wf

      # Redis 7.2.16 and its redis-cli, built from the release archive and
      # cached under the key the gate uses; Ubuntu's package is 7.0.15. Both
      # matrix servers need redis-cli, and the redis server needs the rest.
      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Put the reference Redis 7.2.16 on PATH
        run: |
          bin=$(tests/redis-suite/reference.sh)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/redis-server" --version

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      # firn's build needs the LLVM major the pinned release was built with.
      - name: Install the pinned release's LLVM
        if: ${{ matrix.server == 'firn' }}
        run: make toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build firn
        if: ${{ matrix.server == 'firn' }}
        run: |
          make firn
          echo "FIRN=$GITHUB_WORKSPACE/build/firn" >> "$GITHUB_ENV"

      - name: Run the consumer's tests
        env:
          OUT: ${{ runner.temp }}/consumers
        run: bash research/experiments/consumers/run.sh "${{ matrix.consumer }}" "${{ matrix.server }}"

      - name: Publish the result
        if: always()
        env:
          DIR: ${{ runner.temp }}/consumers/${{ matrix.consumer }}-${{ matrix.server }}
        run: |
          {
            echo "## ${{ matrix.consumer }} against ${{ matrix.server }}"
            echo
            echo '```text'
            cat "$DIR/what.txt" 2>/dev/null || true
            echo "tests exited $(cat "$DIR/status" 2>/dev/null || echo '(not run)')"
            tail -n 15 "$DIR/test.log" 2>/dev/null || true
            echo '```'
            if [ -f "$DIR/profile.tsv" ]; then
              echo
              echo '```text'
              cat "$DIR/profile.tsv"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumers-${{ matrix.consumer }}-${{ matrix.server }}
          path: |
            ${{ runner.temp }}/consumers/${{ matrix.consumer }}-${{ matrix.server }}/*.txt
            ${{ runner.temp }}/consumers/${{ matrix.consumer }}-${{ matrix.server }}/*.log
            ${{ runner.temp }}/consumers/${{ matrix.consumer }}-${{ matrix.server }}/*.tsv
            ${{ runner.temp }}/consumers/${{ matrix.consumer }}-${{ matrix.server }}/status
