# Temporary (firn-rw-publish-during-append-error): the network cases about
# AOF write errors and rewrites, and the device fault cases, for this branch
# only. Removed before the branch is ready.
name: tmp-rw-publish

on:
  push:
    branches: [claude/rw-publish-design]

concurrency:
  group: tmp-rw-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    name: write-error and rewrite network cases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
          make toolchain
      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version
      - name: Build firn as the network cases run it
        run: make compiler firn-test
      - name: Restore the Redis build
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Run the write-error and rewrite cases
        run: |
          bin=$(tests/redis-suite/reference.sh)
          FIRN="$PWD/build/firn-test" REDIS_SERVER="$bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --test network -- \
            aof_write_errors:: rewrite --skip rewrite_faults:: --show-output
          FIRN="$PWD/build/firn-test" REDIS_SERVER="$bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --test network rewrite_faults:: -- \
            --test-threads=1 --nocapture

  aof-sync-fault:
    name: AOF sync and rewrite failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dmsetup strace
          make toolchain
      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version
      - name: Build firn as the network cases run it
        run: make compiler firn-test
      - name: Restore the Redis build
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Build the reference Redis, the oracle
        run: |
          bin=$(tests/redis-suite/reference.sh)
          echo "REDIS_SERVER=$bin/redis-server" >> "$GITHUB_ENV"
      - name: Make the faulty device
        run: |
          mount="$RUNNER_TEMP/sync-fault"
          sudo tests/aof_sync_fault_device.sh setup "$mount" "$(id -u):$(id -g)"
          echo "FIRN_SYNC_FAULT_MOUNT=$mount" >> "$GITHUB_ENV"
      - name: Check that no periodic writeback reaches the faulty device
        run: sudo tests/aof_sync_fault_device.sh check-writeback "$FIRN_SYNC_FAULT_MOUNT"
      - name: Run the sync and rewrite fault cases
        run: make aof-sync-fault
      - name: Show Redis's log
        if: failure()
        run: cat /tmp/firn-sync-fault-redis-*.log || true
      - name: Remove the faulty device
        if: always()
        run: sudo tests/aof_sync_fault_device.sh teardown "$RUNNER_TEMP/sync-fault"
