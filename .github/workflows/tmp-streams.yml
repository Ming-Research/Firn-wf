# Temporary quick workflow for firn-streams-core: builds firn and runs only
# the stream units of the Redis suite and the stream network cases. Removed
# before the branch is ready.
name: tmp-streams

on:
  push:
    branches: [firn-streams-core]

concurrency:
  group: tmp-streams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streams:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install the suite's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl patch
      - run: make compiler
      - run: make toolchain
      - name: Restore the Redis build
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: tests/redis-suite/reference.sh
      - name: Build firn
        run: make firn
      - name: Stream units of the Redis suite
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: |
          status=0
          tests/redis-suite/run.sh --out build/stream-suite --units "unit/type/stream unit/type/stream-cgroups" firn build/firn || status=$?
          cat build/stream-suite/summary.txt || true
          grep -P '^unit/type/stream\t' build/stream-suite/tests.tsv || true
          grep -P '^unit/type/stream-cgroups\t' build/stream-suite/tests.tsv | head -5 || true
          exit $status
      - name: Build firn-test
        run: make firn-test
      - name: List ceiling cases
        run: make list-ceiling
      - name: Stream network cases
        run: |
          redis_bin=$(REDIS_COMPAT_CACHE="$PWD/build/redis-compat-cache" tests/redis-suite/reference.sh)
          FIRN=$PWD/build/firn-test REDIS_SERVER="$redis_bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --test network streams:: -- --show-output
