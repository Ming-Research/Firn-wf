# Temporary (firn-pubsub-cmd-regression): runs the selftest of summary.py, which
# no other workflow runs, and shows that the case added for `ratios --metric
# cpu` fails when the ratio is not inverted; runs the network case added for
# the commands that follow a subscription in one write, and shows that it fails
# when the ordinary owner no longer stops at the first subscription but hands
# the connection over only after the commands of the read. Removed before the
# pull request is ready.
name: tmp-firn-pubsub-cmd-regression

on:
  push:
    branches: [firn-pubsub-cmd-regression]

jobs:
  selftest:
    name: summary.py selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The selftest passes
        run: python3 -I research/experiments/redis-bench/summary.py selftest

  selftest-broken:
    name: summary.py selftest fails on a ratio that is not inverted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Make the cpu ratio the uninverted one
        run: |
          grep -c 'return denominator / numerator if cpu else numerator / denominator' research/experiments/redis-bench/summary.py
          sed -i 's|return denominator / numerator if cpu else numerator / denominator|return numerator / denominator|' research/experiments/redis-bench/summary.py
          ! grep -q 'denominator / numerator' research/experiments/redis-bench/summary.py
      - name: The selftest fails
        run: |
          if python3 -I research/experiments/redis-bench/summary.py selftest; then
            echo "the selftest accepted a cpu ratio that is not inverted" >&2
            exit 1
          fi

  boundary:
    name: the case passes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Download the pinned compiler
        run: make compiler
      - name: Install the pinned release's LLVM
        run: make toolchain
      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version
      - name: Build firn for the network cases
        run: make firn-test
      - name: Run the case
        run: |
          FIRN="$PWD/build/firn-test" cargo test --manifest-path tests/Cargo.toml --locked --test network \
            pubsub::commands_after_a_subscription_in_one_write_see_subscriber_mode -- --show-output

  boundary-broken:
    name: the case fails when the hand-over waits for the end of the read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      # The experiment commit checks client.pubsub_id once per read, after the
      # loop over its commands, instead of after every command: the commands
      # that follow a subscription in the read run in the ordinary owner.
      - name: Take serve with the check once per read
        run: |
          git fetch origin firn-pubsub-cmd-regression-exp3
          git checkout 6263405e3b591fbc075a07a291fb4e370bf8289e -- firn/server/server.wf
          ! git diff --quiet HEAD -- firn/server/server.wf
      - name: Download the pinned compiler
        run: make compiler
      - name: Install the pinned release's LLVM
        run: make toolchain
      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version
      - name: Build firn for the network cases
        run: make firn-test
      - name: The case fails where the refusal of GET is expected
        run: |
          line=$(grep -n 'assert_eq!(frame(&mut client), refusal("get"));' tests/pubsub.rs | head -1 | cut -d: -f1)
          log=$(mktemp)
          if FIRN="$PWD/build/firn-test" cargo test --manifest-path tests/Cargo.toml --locked --test network \
            pubsub::commands_after_a_subscription_in_one_write_see_subscriber_mode -- --show-output >"$log" 2>&1; then
            cat "$log"
            echo "the case passed with an ordinary owner that hands over only at the end of the read" >&2
            exit 1
          fi
          cat "$log"
          grep -q "pubsub.rs:$line:" "$log"
