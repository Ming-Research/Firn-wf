# firn's gate: every push runs the targets of `make check` in four parallel
# jobs, so that its answer takes as long as the slowest, the Redis suite. The
# jobs download the pinned Whitefoot compiler release, then build firn and run
# the Redis suite ratchet; build firn and run its network cases; lint the
# design trees and check the measurement instrument without starting servers;
# and compile the safety witnesses. `make gate-sync` fails when
# their targets differ from `make check`, so each step that runs a target of
# it stays on one line. The exact revision that merges into main passes this
# first. A push to a branch the engine of wf-agents makes (`work-…`,
# `wf-try/…`) runs nothing: the engine asks for the runs it needs by hand.
#
# It is also firn's full workflow (`ci.full` of wf-agents.toml): before the
# engine merges a work, it runs this file as main holds it, by hand, with the
# commit to test and a value only its request knows, which the run's name
# holds. Each test, a target in TESTS of the Makefile, runs in a step by
# itself through whitefoot-kit/ci/run-tests.py, which writes what became of it
# as JUnit XML in a file named by the job; the job `results` gathers the files
# in the artifact `test-results`, which the engine reads.
name: check
run-name: ${{ inputs.call && format('check {0}', inputs.call) || '' }}

on:
  push:
    branches-ignore: ['work-*', 'wf-try/**']
    tags: ['**']
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test; empty for the commit the run is asked on
        required: false
        default: ''
      call:
        description: A value only the request that asks for this run knows, which the run's name holds; empty for a run asked by hand
        required: false
        default: ''
      test_stop:
        description: How long one test may run before it is stopped, in whole seconds; empty for no stop but the job's limit
        required: false
        default: ''

# A newer push to the same branch makes the older run pointless; every run the
# engine asks for is kept.
concurrency:
  group: check-${{ inputs.call || github.ref }}
  cancel-in-progress: ${{ !inputs.call }}

jobs:
  suite:
    name: firn and Redis suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/firn and Redis suite.xml
      TESTS_SUITE: firn and Redis suite
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: true

      # The pinned compiler links with /usr/bin/clang, and a cached build
      # links its ThinLTO fragments with LLD on Linux, of the LLVM major the
      # pinned release was built with, which Whitefoot-kit's `make toolchain`
      # installs. The suite runs under tclsh; its redis-cli and
      # redis-benchmark come from the reference build below.
      - name: Install the suite's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl patch

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Show the host toolchain
        run: |
          ld.lld --version
          /usr/bin/clang --version
          python3 --version

      # The reference Redis 7.2.16 (AGENTS.md) is built from its release
      # archive, whose SHA-256 reference.sh pins; Ubuntu packages 7.0.15. The
      # suite's sources and its redis-cli and redis-benchmark come from this
      # one build. The key names reference.sh, which holds the pin and the
      # build recipe. The build is saved as soon as it is made, so that a
      # later failing step, as a ratchet regression is, does not discard it.
      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: tests/redis-suite/reference.sh

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build firn
        run: whitefoot-kit/ci/run-tests.py firn

      - name: Run the Redis suite in two shards and check the ratchet
        run: whitefoot-kit/ci/run-tests.py redis-suite

      - name: Upload the Redis suite run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-suite-${{ inputs.commit || github.sha }}
          path: build/redis-suite

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-suite
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  network:
    name: network tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/network tests.xml
      TESTS_SUITE: network tests
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: true

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Show the host toolchain
        run: |
          ld.lld --version
          /usr/bin/clang --version

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Install syscall fault instrumentation
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace

      - name: Cache the pinned Redis oracle for rewrite crash cases
        uses: actions/cache@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      # Board item firn-test-recv-eintr: a socket read with a timeout once
      # failed with EINTR, but the tests send the test process no signal.
      # The kernel's signal_generate tracepoint records every signal sent on
      # the runner with its sender and target, so a recurrence names its
      # source. Both steps are diagnostic and never fail the job. Remove
      # them with that item once the source is fixed.
      - name: Record every signal sent during the network cases
        run: |
          t=/sys/kernel/tracing
          sudo sh -c "echo 32768 > $t/buffer_size_kb && echo 1 > $t/events/signal/signal_generate/enable && echo 1 > $t/tracing_on" ||
            echo "::warning::signal tracing unavailable"

      - name: Build firn for the network cases and run them
        run: whitefoot-kit/ci/run-tests.py test

      # SIGCHLD (17), sent at every child's exit, has no handler in the test
      # process and so cannot interrupt a read; it is only counted. SIGURG
      # (23) is summarized by sender and target with their pids, because the
      # runner's own agents send it thousands of times to themselves. Every
      # other signal is listed with its sender (the task column) and its
      # target (comm= and pid=).
      - name: Show the signals sent during the network cases
        if: always()
        run: |
          t=/sys/kernel/tracing
          sudo sh -c "echo 0 > $t/tracing_on" || true
          sudo cat $t/trace > "$RUNNER_TEMP/signals.txt" || true
          echo "signal_generate events by signal number:"
          grep -o 'signal_generate: sig=[0-9]*' "$RUNNER_TEMP/signals.txt" | sort | uniq -c
          echo "lost events per CPU buffer (overrun):"
          sudo sh -c "grep -h overrun $t/per_cpu/cpu*/stats" | sort | uniq -c
          echo "SIGURG by sender and target:"
          grep 'signal_generate: sig=23 ' "$RUNNER_TEMP/signals.txt" |
            sed -E 's/^ *(.*-[0-9]+) +\[.*comm=([^ ]*) pid=([0-9]+).*/\1 -> \2-\3/' | sort | uniq -c
          echo "every other signal:"
          grep 'signal_generate:' "$RUNNER_TEMP/signals.txt" | grep -v -E ' sig=(17|23) ' || true

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-network
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  safety-witnesses:
    name: rejected and accepted safety witnesses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/rejected and accepted safety witnesses.xml
      TESTS_SUITE: rejected and accepted safety witnesses
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit
      - name: Download the pinned compiler
        run: make compiler
      - name: Install the pinned release's LLVM
        run: make toolchain
      - name: Compile faulty and corrected bug patterns
        run: whitefoot-kit/ci/run-tests.py safety-witnesses
      - name: Preserve diagnostics and source hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-witnesses
          path: |
            build/safety-witnesses/results.json
            build/safety-witnesses/**/*.stdout
            build/safety-witnesses/**/*.stderr
          if-no-files-found: warn
      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"
      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-safety-witnesses
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  design:
    name: design lint, instrument selftests and gate sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/design lint and gate sync.xml
      TESTS_SUITE: design lint and gate sync
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      # The Makefile includes Whitefoot-kit, and the lint is Design-skill's.
      - name: Check out Design-skill and Whitefoot-kit
        run: git submodule update --init design/skill whitefoot-kit

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip. A commit the engine gives is reviewed
      # as a work branch is: the one it checks before a merge merges main into
      # the work's branch, so its first parent is not main.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT" ]; then
            design_review_base=$(git merge-base refs/remotes/origin/main HEAD)
          else
            design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          fi
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Lint the design trees
        run: whitefoot-kit/ci/run-tests.py design-lint

      - name: Check the measurement instrument without starting servers
        run: make placement-selftest

      - name: Check that these jobs run every target of make check
        run: whitefoot-kit/ci/run-tests.py gate-sync

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-design
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The append-only file's sync failing on a real device:
  # tests/aof_sync_fault_device.sh makes a device-mapper device whose writes
  # and flushes fail on command, under an ext4 filesystem the case runs firn
  # and Redis 7.2.16, its oracle, on. The cases are ignored in `make check`,
  # which has no such device; here they run serially, and a device that cannot be
  # made, a missing oracle or a run that passes no case fails the job.
  aof-sync-fault:
    name: AOF sync and rewrite failures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/AOF sync and rewrite failures.xml
      TESTS_SUITE: AOF sync and rewrite failures
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          submodules: true

      # As in `check`: the cached test build links with /usr/bin/clang and
      # LLD of the pinned release's LLVM major. dmsetup drives the device.
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dmsetup strace
          make toolchain
          ld.lld --version
          /usr/bin/clang --version

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Build firn as the network cases run it
        run: make compiler firn-test

      # The oracle is the reference Redis 7.2.16 of the gate's job, built by
      # reference.sh from its pinned release archive and cached under the
      # same key.
      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis, the oracle
        run: |
          bin=$(tests/redis-suite/reference.sh)
          "$bin/redis-server" --version
          echo "REDIS_SERVER=$bin/redis-server" >> "$GITHUB_ENV"

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Make the faulty device
        run: |
          uname -r
          mount="$RUNNER_TEMP/sync-fault"
          sudo tests/aof_sync_fault_device.sh setup "$mount" "$(id -u):$(id -g)"
          echo "FIRN_SYNC_FAULT_MOUNT=$mount" >> "$GITHUB_ENV"

      # Shows before the cases that the kernel's periodic writeback no longer
      # reaches the failing device: a file made and never synced survives 40 s
      # of failure. It fails if the flusher writes metadata during the window.
      - name: Check that no periodic writeback reaches the faulty device
        run: sudo tests/aof_sync_fault_device.sh check-writeback "$FIRN_SYNC_FAULT_MOUNT"

      # The target fails without FIRN_SYNC_FAULT_MOUNT and REDIS_SERVER, set
      # by the steps above, and unless all eight of its cases ran and passed.
      - name: Run the sync and rewrite fault cases
        run: whitefoot-kit/ci/run-tests.py aof-sync-fault

      - name: Show the kernel's account of the device
        if: always()
        run: |
          sudo dmesg | grep -E 'dm-|EXT4-fs|I/O error|flakey|loop' | tail -n 100 || true
          echo '--- space and metadata loss'
          df -h "$FIRN_SYNC_FAULT_MOUNT" || true
          df -i "$FIRN_SYNC_FAULT_MOUNT" || true
          sudo dmesg | grep -E 'lost async|checksum|doubly|EXT4-fs error' | tail -n 50 || true

      - name: Show Redis's log
        if: failure()
        run: cat /tmp/firn-sync-fault-redis-*.log || true

      # Also after a setup that failed half way: teardown skips what is gone.
      - name: Remove the faulty device
        if: always()
        run: sudo tests/aof_sync_fault_device.sh teardown "$RUNNER_TEMP/sync-fault"

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: whitefoot-kit/ci/run-tests.py --end "$STATUS"

      - name: Keep the job's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-aof-sync-fault
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The JUnit of every job, in the one artifact the engine reads. It needs
  # every other job and judges nothing: it never fails the run.
  results:
    needs: [suite, network, safety-witnesses, design, aof-sync-fault]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*
