# firn's gate: every push runs the targets of `make check` in three parallel
# jobs, so that its answer takes as long as the slowest, the Redis suite. The
# jobs download the pinned Whitefoot compiler release, then build firn and run
# the Redis suite ratchet; build firn and run its network cases; and lint the
# design trees. `make gate-sync` fails when the targets they run and the
# targets of `make check` differ, so each `make TARGET` step below stays on
# one line. The exact revision that merges into main passes this first.
name: check

on:
  push:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: firn and Redis suite
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The pinned compiler links with /usr/bin/clang, and a cached build
      # links its ThinLTO fragments with LLD on Linux, of the LLVM major the
      # pinned release was built with, which Whitefoot-kit's `make toolchain`
      # installs. The suite runs under tclsh; its redis-cli and
      # redis-benchmark come from the reference build below.
      - name: Install the suite's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcl patch

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Show the host toolchain
        run: |
          ld.lld --version
          /usr/bin/clang --version
          python3 --version

      # The reference Redis 7.2.16 (AGENTS.md) is built from its release
      # archive, whose SHA-256 reference.sh pins; Ubuntu packages 7.0.15. The
      # suite's sources and its redis-cli and redis-benchmark come from this
      # one build. The key names reference.sh, which holds the pin and the
      # build recipe. The build is saved as soon as it is made, so that a
      # later failing step, as a ratchet regression is, does not discard it.
      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis
        env:
          REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
        run: tests/redis-suite/reference.sh

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build firn
        run: make firn

      - name: Run the Redis suite in two shards and check the ratchet
        run: make redis-suite

      - name: Upload the Redis suite run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-suite-${{ github.sha }}
          path: build/redis-suite

  network:
    name: network tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Show the host toolchain
        run: |
          ld.lld --version
          /usr/bin/clang --version

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Build firn for the network cases and run them
        run: make test

  design:
    name: design lint and gate sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Makefile includes Whitefoot-kit, and the lint is Design-skill's.
      - name: Check out Design-skill and Whitefoot-kit
        run: git submodule update --init design/skill whitefoot-kit

      - name: Name main as a local ref
        run: git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main

      # A work branch is reviewed against its fork point from main; a main
      # push against its previous tip.
      - name: Select the design review base
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          design_review_base=$(sh design/skill/review-base.sh "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$PUSH_BEFORE")
          echo "DESIGN_REVIEW_BASE=$design_review_base" >> "$GITHUB_ENV"
          git log --oneline -1 "$design_review_base"

      - name: Lint the design trees
        run: make design-lint

      - name: Check that these jobs run every target of make check
        run: make gate-sync

  # The append-only file's sync failing on a real device:
  # tests/aof_sync_fault_device.sh makes a device-mapper device whose writes
  # and flushes fail on command, under an ext4 filesystem the case runs firn
  # and Redis 7.2.16, its oracle, on. The case is ignored in `make check`,
  # which has no such device; here it runs alone, and a device that cannot be
  # made, a missing oracle or a run that passes no case fails the job.
  aof-sync-fault:
    name: AOF sync failure on a faulty device
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # As in `check`: the cached test build links with /usr/bin/clang and
      # LLD of the pinned release's LLVM major. dmsetup drives the device.
      - name: Install the host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dmsetup
          make toolchain
          ld.lld --version
          /usr/bin/clang --version

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Build firn as the network cases run it
        run: make compiler firn-test

      # The oracle is the reference Redis 7.2.16 of the gate's job, built by
      # reference.sh from its pinned release archive and cached under the
      # same key.
      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Build the reference Redis, the oracle
        run: |
          bin=$(tests/redis-suite/reference.sh)
          "$bin/redis-server" --version
          echo "REDIS_SERVER=$bin/redis-server" >> "$GITHUB_ENV"

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Make the faulty device
        run: |
          uname -r
          mount="$RUNNER_TEMP/sync-fault"
          sudo tests/aof_sync_fault_device.sh setup "$mount" "$(id -u):$(id -g)"
          echo "FIRN_SYNC_FAULT_MOUNT=$mount" >> "$GITHUB_ENV"

      # Shows before the cases that the kernel's periodic writeback no longer
      # reaches the failing device: a file made and never synced survives 40 s
      # of failure. It fails if the flusher writes metadata during the window.
      - name: Check that no periodic writeback reaches the faulty device
        run: sudo tests/aof_sync_fault_device.sh check-writeback "$FIRN_SYNC_FAULT_MOUNT"

      # The target fails without FIRN_SYNC_FAULT_MOUNT and REDIS_SERVER, set
      # by the steps above, and unless both of its cases ran and passed.
      - name: Run the sync-failure cases
        run: make aof-sync-fault

      - name: Show the kernel's account of the device
        if: always()
        run: |
          sudo dmesg | grep -E 'dm-|EXT4-fs|I/O error|flakey|loop' | tail -n 100 || true
          echo '--- space and metadata loss'
          df -h "$FIRN_SYNC_FAULT_MOUNT" || true
          df -i "$FIRN_SYNC_FAULT_MOUNT" || true
          sudo dmesg | grep -E 'lost async|checksum|doubly|EXT4-fs error' | tail -n 50 || true

      - name: Show Redis's log
        if: failure()
        run: cat /tmp/firn-sync-fault-redis-*.log || true

      # Also after a setup that failed half way: teardown skips what is gone.
      - name: Remove the faulty device
        if: always()
        run: sudo tests/aof_sync_fault_device.sh teardown "$RUNNER_TEMP/sync-fault"
