# Temporary: runs the runtime-contention witnesses
# (research/experiments/runtime-contention/) on the owner's i9-14900K or a
# GitHub runner, as research/experiments/runtime-contention/run.env sets
# when that file changes on this branch, and keeps their CSV and each run's
# standard output and error. Removed before the branch is ready.
name: runtime-contention

on:
  push:
    branches: [claude/witness-contention]
    paths: [research/experiments/runtime-contention/run.env]

defaults:
  run:
    shell: bash

concurrency:
  group: runtime-contention-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.read.outputs.runner }}
      contexts: ${{ steps.read.outputs.contexts }}
      millis: ${{ steps.read.outputs.millis }}
      passes: ${{ steps.read.outputs.passes }}
      witnesses: ${{ steps.read.outputs.witnesses }}
      cpu_lists: ${{ steps.read.outputs.cpu_lists }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: grep -E '^(runner|contexts|millis|passes|witnesses|cpu_lists)=' research/experiments/runtime-contention/run.env >> "$GITHUB_OUTPUT"

  witnesses:
    needs: settings
    name: runtime-contention (${{ needs.settings.outputs.runner }})
    runs-on: ${{ needs.settings.outputs.runner == '14900k' && fromJSON('["self-hosted", "14900k"]') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit deps/halo-wf

      # The self-hosted machine keeps its tools installed and gives a job no
      # passwordless sudo.
      - name: Install or check the pinned release's LLVM
        run: |
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            make toolchain
          else
            make toolchain-check
          fi

      - name: Run the witnesses
        env:
          CONTEXTS: ${{ needs.settings.outputs.contexts }}
          MILLIS: ${{ needs.settings.outputs.millis }}
          PASSES: ${{ needs.settings.outputs.passes }}
          WITNESSES: ${{ needs.settings.outputs.witnesses }}
          CPU_LISTS: ${{ needs.settings.outputs.cpu_lists }}
        run: bash research/experiments/runtime-contention/run.sh --out "$RUNNER_TEMP/runtime-contention"

      - name: Publish the results
        if: always()
        run: |
          {
            echo "## runtime-contention"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/runtime-contention/host.txt" "$RUNNER_TEMP/runtime-contention/results.csv" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-contention-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/runtime-contention/*.csv
            ${{ runner.temp }}/runtime-contention/*.txt
            ${{ runner.temp }}/runtime-contention/runs/
