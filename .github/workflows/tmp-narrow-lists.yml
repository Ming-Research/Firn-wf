# Temporary (firn-scope-blocking-lists), on branch claude/blocking-lists only,
# deleted before the branch is ready: builds firn for the network cases and
# runs only the list and blocking-list cases and the design lint, so that a
# change to how list writes hold the keyspace is checked without the whole gate.
name: tmp-narrow-lists

on:
  push:
    branches: [claude/blocking-lists]

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Cache the pinned Redis oracle
        uses: actions/cache@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Design lint
        run: make design-lint

      - name: Build firn for the network cases
        run: make firn-test

      - name: The list and blocking-list network cases
        run: |
          redis_bin=$(tests/redis-suite/reference.sh)
          FIRN="$GITHUB_WORKSPACE/build/firn-test" REDIS_SERVER="$redis_bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --test network -- \
            blocking_lists lists list_push narrow --show-output
