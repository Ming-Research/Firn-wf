# Temporary (firn-scope-blocking-lists), on branch claude/blocking-lists only,
# deleted before the branch is ready: runs the compare mode's list-form check
# for lpush_new against Redis 7.2.16 alone (the reference line), once as it is
# and once with each of two broken forms, which must stop the run. Function
# only: a hosted runner's rates mean nothing.
name: tmp-compare-forms

on:
  push:
    branches: [claude/blocking-lists]

env:
  REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache

jobs:
  forms:
    name: ${{ matrix.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [as-written, fixed-key, range-of-one]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned Redis oracle
        uses: actions/cache@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Break the form
        run: |
          script=research/experiments/redis-bench/redis-bench.sh
          case ${{ matrix.case }} in
            as-written) ;;
            fixed-key) sed -i 's|echo "LPUSH new$1:__rand_int__ xxx"|echo "LPUSH new$1:fixed xxx"|' "$script" ;;
            range-of-one) sed -i 's|^NEW_LIST_RANGE=2000000000|NEW_LIST_RANGE=1|' "$script" ;;
          esac
          git diff --stat

      - name: Run compare on Redis 7.2.16 alone
        run: |
          bin=$(tests/redis-suite/reference.sh)
          export PATH="$bin:$PATH"
          export OUT="$RUNNER_TEMP/redis-bench"
          mkdir -p "$OUT"
          export IMAGES= COMPARE_REFERENCE=true COMPARE_TESTS="linsert lmove lpush_new" \
            COMPARE_DEPTHS="16 1" COMPARE_PASSES=1 COMPARE_SECONDS=1 COMPARE_CPUS=1 \
            SERVER_CPU_LIST=0 CLIENT_CPU_LIST=1
          status=0
          sh research/experiments/redis-bench/redis-bench.sh compare >"$OUT/bench.txt" 2>&1 || status=$?
          cat "$OUT/bench.txt"
          if [ "${{ matrix.case }}" = as-written ]; then
            [ "$status" -eq 0 ] || { echo "the run failed ($status)"; exit 1; }
            grep -q '^reference,1,1,lpush_new,16,' "$OUT/compare.csv"
            grep -q '^reference,1,1,lpush_new,1,' "$OUT/compare.csv"
          else
            [ "$status" -ne 0 ] || { echo "the broken form was not caught"; exit 1; }
            grep -q 'the lpush_new form (created 1 lists of 100 pushes)' "$OUT/bench.txt"
          fi
