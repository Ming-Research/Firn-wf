# Temporary: shows that the rotation-charge check in
# reconciled_scan_post_cut_backlog_charges_rotation_reserve fails when
# eviction.wf stops subtracting aof_charged. Removed before the branch is
# ready (item firn-rw-cache-refused).
name: tmp-rotation-charge-check

on:
  push:
    branches: [claude/rw-under-maxmemory]
  workflow_dispatch:

jobs:
  mutant:
    name: aof_charged subtraction removed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download the pinned compiler
        run: make compiler

      - name: Install the pinned release's LLVM
        run: make toolchain

      - name: Select the Rust toolchain
        run: rustup default stable && cargo --version

      - name: Remove the rotation-charge subtraction
        run: |
          f=firn/commands/eviction.wf
          sed -i 's/let rewrite = meta^.rewrite.used -sat meta^.rewrite.aof_charged;/let rewrite = meta^.rewrite.used;/' "$f"
          grep -q 'let rewrite = meta^.rewrite.used;' "$f"

      - name: Build the mutant firn for the network cases
        run: make firn-test

      - name: The check must fail on the mutant
        run: |
          redis_bin=$(REDIS_COMPAT_CACHE="$REDIS_COMPAT_CACHE" tests/redis-suite/reference.sh)
          log=$(mktemp)
          set +e
          FIRN=$PWD/build/firn-test REDIS_SERVER="$redis_bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked \
            -- reconciled_scan_post_cut_backlog --test-threads=1 --nocapture >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -eq 0 ]; then
            echo "::error::the check passed on the mutant"
            exit 1
          fi
          grep -q 'rotation charges must be excluded' "$log"
          echo "mutant failed as the check intends"
