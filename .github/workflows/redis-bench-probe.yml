# Temporary: checks session.py's registration lock and its reread failure on
# a GitHub-hosted runner, where /proc behaves as on the 14900K; removed after
# it runs.
name: redis-bench-probe

on:
  push:
    branches: [claude/redis-bench]

jobs:
  session:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Registration after the record is retired, or from another session, is refused
        run: |
          py=$PWD/research/experiments/redis-bench/session.py
          rec="$RUNNER_TEMP/session"
          setsid sh -c 'python3 "$1" record "$2" $$ || exit 1; (python3 "$1" register "$2" parent && exec sleep 911) & exec sleep 912' run "$py" "$rec" > /dev/null 2>&1 &
          sleep 1
          cat "$rec"
          [ "$(wc -l < "$rec")" = 2 ] || { echo "FAIL: the server did not register"; exit 1; }
          leader=$(head -1 "$rec" | cut -d' ' -f2)
          kill -KILL "$leader"; sleep 0.5
          python3 "$py" stop "$rec"
          test ! -e "$rec" || { echo "FAIL: record kept"; exit 1; }
          ! pgrep -f 'sleep 911' > /dev/null || { echo "FAIL: the registered server survived"; exit 1; }
          echo "1. stopped and retired"
          touch "$rec.held"
          if python3 "$py" register "$rec" $$; then echo "FAIL: registered after retirement"; exit 1; fi
          echo "2. registration after retirement refused"
          setsid sh -c 'python3 "$1" record "$2" $$ || exit 1; exec sleep 913' run "$py" "$rec" > /dev/null 2>&1 &
          sleep 1
          if python3 "$py" register "$rec" $$; then echo "FAIL: registered a process of another session"; exit 1; fi
          echo "3. registration from another session refused"
          leader=$(head -1 "$rec" | cut -d' ' -f2)
          python3 "$py" stop "$rec"
          ! kill -0 "$leader" 2>/dev/null || { echo "FAIL: the leader survived"; exit 1; }
          test ! -e "$rec" || { echo "FAIL: record kept"; exit 1; }
          echo "4. a live leader's session stopped and retired"
      - name: A record that stops reading while its session is stopped is kept and fails
        run: |
          cd research/experiments/redis-bench
          python3 - "$RUNNER_TEMP/flaky" <<'PY'
          import os, subprocess, sys, time
          import session
          path = sys.argv[1]
          child = subprocess.Popen(["setsid", "sh", "-c", 'python3 session.py record "$0" $$ && exec sleep 914', path])
          time.sleep(1)
          real = session.read_record
          calls = []
          def flaky(p):
              calls.append(p)
              return real(p) if len(calls) == 1 else None
          session.read_record = flaky
          try:
              session.stop(path)
          except SystemExit as stop:
              print("stop exited:", stop.code)
              assert os.path.exists(path), "record removed"
              print("5. kept and failed when the record stopped reading")
              child.kill()
              sys.exit(0)
          child.kill()
          sys.exit("FAIL: stop succeeded on an unreadable record")
          PY
