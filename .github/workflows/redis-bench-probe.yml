# Temporary: checks session.py and redis-bench.yml's session helpers on the
# 14900K, each path once, and one small comparison that stops a planted
# leftover holding a registered redis-server; removed after it runs.
name: redis-bench-probe

on:
  push:
    branches: [claude/redis-bench]

jobs:
  helpers:
    runs-on: [self-hosted, 14900k]
    steps:
      - uses: actions/checkout@v4
      - name: Check each path of the session helpers
        run: |
          awk '/<<.HELPERS./{f=1;next} /^ *HELPERS$/{f=0} f' .github/workflows/redis-bench.yml | sed 's/^          //' > "$RUNNER_TEMP/h.sh"
          export SESSION_FILE="$RUNNER_TEMP/s/session"
          . "$RUNNER_TEMP/h.sh"
          py=$PWD/research/experiments/redis-bench/session.py
          sock="$RUNNER_TEMP/s/redis.sock"
          mkdir -p "$RUNNER_TEMP/s"
          gone() { ! ps -s "$1" -o pid= | grep -q .; }
          started() { sed 's/^.*) //' "/proc/$1/stat" | cut -d' ' -f20; }
          echo "1. a live leader with another start time is another session: left alone"
          RUNNER_TRACKING_ID= setsid sh -c 'echo $$ > "$1"; exec sleep 901' run "$RUNNER_TEMP/s/foreign" > /dev/null 2>&1 &
          sleep 1
          foreign=$(cat "$RUNNER_TEMP/s/foreign")
          echo "$(cat /proc/sys/kernel/random/boot_id) $foreign 1" > "$SESSION_FILE"
          stop_recorded
          kill -0 "$foreign" || { echo "   FAIL: stopped"; exit 1; }
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          kill "$foreign"
          echo "   left alone: $foreign"
          echo "2. a record from an earlier boot is removed and nothing is signalled"
          RUNNER_TRACKING_ID= setsid sh -c 'echo $$ > "$1"; exec sleep 904' run "$RUNNER_TEMP/s/other" > /dev/null 2>&1 &
          sleep 1
          other=$(cat "$RUNNER_TEMP/s/other")
          echo "00000000-0000-0000-0000-000000000000 $other $(started "$other")" > "$SESSION_FILE"
          stop_recorded
          kill -0 "$other" || { echo "   FAIL: stopped"; exit 1; }
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          kill "$other"
          echo "   left alone: $other"
          echo "3. while the leader runs, every process of its session is stopped, TERM then KILL"
          RUNNER_TRACKING_ID= setsid sh -c 'python3 "$1" record "$2" $$ || exit 1; redis-server --port 0 --unixsocket "$3" --save "" --appendonly no --daemonize no > /dev/null 2>&1 & python3 "$1" register "$2" $!; (trap "" TERM; exec sleep 902) & exec sleep 905' run "$py" "$SESSION_FILE" "$sock" > /dev/null 2>&1 &
          sleep 2
          owned=$(head -1 "$SESSION_FILE" | cut -d' ' -f2)
          cat "$SESSION_FILE"
          ps -s "$owned" -o pid,args
          redis-cli -s "$sock" ping || { echo "   FAIL: no live redis-server"; exit 1; }
          stop_recorded
          gone "$owned" || { echo "   FAIL: survived"; ps -s "$owned" -o pid,args; exit 1; }
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          echo "   session $owned stopped whole, record removed"
          echo "4. once the leader has ended, only the registered server is stopped"
          RUNNER_TRACKING_ID= setsid sh -c 'python3 "$1" record "$2" $$ || exit 1; redis-server --port 0 --unixsocket "$3" --save "" --appendonly no --daemonize no > /dev/null 2>&1 & python3 "$1" register "$2" $!; sleep 907 & exec sleep 908' run "$py" "$SESSION_FILE" "$sock" > /dev/null 2>&1 &
          sleep 2
          owned=$(head -1 "$SESSION_FILE" | cut -d' ' -f2)
          server=$(pgrep -s "$owned" redis-server)
          client=$(pgrep -s "$owned" -f 'sleep 907')
          redis-cli -s "$sock" ping || { echo "   FAIL: no live redis-server"; exit 1; }
          echo "   redis-server $server environment as /proc shows it:"
          tr '\0' '\n' < "/proc/$server/environ" | head -3 || true
          kill -KILL "$owned"
          sleep 1
          stop_recorded
          ! kill -0 "$server" 2>/dev/null || { echo "   FAIL: redis-server $server survived"; exit 1; }
          kill -0 "$client" || { echo "   FAIL: the unregistered process was stopped"; exit 1; }
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          kill "$client"
          echo "   redis-server $server stopped, unregistered $client left to the runner, record removed"
          echo "5. a number now naming another session whose leader has ended: its process is left alone"
          RUNNER_TRACKING_ID= setsid sh -c 'echo $$ > "$1"; sleep 906 & exit 0' run "$RUNNER_TEMP/s/reused" > /dev/null 2>&1 &
          sleep 1
          reused=$(cat "$RUNNER_TEMP/s/reused")
          child=$(pgrep -s "$reused" -f 'sleep 906')
          echo "$(cat /proc/sys/kernel/random/boot_id) $reused 1" > "$SESSION_FILE"
          stop_recorded
          kill -0 "$child" || { echo "   FAIL: the other session's process was stopped"; exit 1; }
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          kill "$child"
          echo "   left alone: $child of session $reused"
          echo "6. a record that does not read is kept and fails the check"
          echo "not a record" > "$SESSION_FILE"
          status=0
          stop_recorded || status=$?
          [ "$status" = 1 ] || { echo "   FAIL: status $status"; exit 1; }
          test -e "$SESSION_FILE" || { echo "   FAIL: record removed"; exit 1; }
          rm -f "$SESSION_FILE"
          echo "   status 1, record kept"
          echo "7. a measurement that fails after starting a registered process leaves nothing"
          fake="$RUNNER_TEMP/fake"
          mkdir -p "$fake/research/experiments/redis-bench"
          printf 'sleep 903 &\npython3 %s register "$FIRN_REDIS_BENCH_RECORD" $!\necho started > "%s/marker"\nexit 3\n' "$py" "$fake" > "$fake/research/experiments/redis-bench/redis-bench.sh"
          status=0
          (cd "$fake" && run_session compare) || status=$?
          [ "$status" = 3 ] || { echo "   FAIL: status $status"; exit 1; }
          test -e "$fake/marker" || { echo "   FAIL: never started"; exit 1; }
          if pgrep -f 'sleep 903' > /dev/null; then echo "   FAIL: its process survived"; pgrep -af 'sleep 903'; exit 1; fi
          test ! -e "$SESSION_FILE" || { echo "   FAIL: record kept"; exit 1; }
          echo "   status 3, its process stopped, no record left"
          echo "8. a record that cannot be written stops the measurement before it starts"
          rm -f "$fake/marker"
          export SESSION_FILE=/proc/1/firn-redis-bench/session
          . "$RUNNER_TEMP/h.sh"
          status=0
          (cd "$fake" && run_session compare) || status=$?
          [ "$status" != 0 ] || { echo "   FAIL: status 0"; exit 1; }
          test ! -e "$fake/marker" || { echo "   FAIL: the measurement started"; exit 1; }
          echo "   status $status, nothing started"
      - name: Whether the runner's account can make a PID namespace, a scope or a cgroup
        run: |
          id
          unshare --user --map-root-user --pid --fork --kill-child true && echo "unshare: yes" || echo "unshare: no"
          systemd-run --user --scope true && echo "systemd-run --user: yes" || echo "systemd-run --user: no"
          sudo -n true && echo "sudo: yes" || echo "sudo: no"
          cg=$(cut -d: -f3 /proc/self/cgroup)
          echo "cgroup: $cg"
          if mkdir "/sys/fs/cgroup$cg/firn-probe" 2>/dev/null; then echo "cgroup child: yes"; rmdir "/sys/fs/cgroup$cg/firn-probe"; else echo "cgroup child: no"; fi

  leftover:
    needs: helpers
    runs-on: [self-hosted, 14900k]
    outputs:
      sid: ${{ steps.plant.outputs.sid }}
    steps:
      - uses: actions/checkout@v4
      - id: plant
        run: |
          mkdir -p ~/.cache/firn-redis-bench
          py=$PWD/research/experiments/redis-bench/session.py
          RUNNER_TRACKING_ID= setsid sh -c 'python3 "$1" record ~/.cache/firn-redis-bench/session $$ || exit 1; redis-server --port 0 --unixsocket "$2" --save "" --appendonly no --daemonize no & python3 "$1" register ~/.cache/firn-redis-bench/session $!; exec sleep 900' run "$py" ~/.cache/firn-redis-bench/probe.sock > /dev/null 2>&1 &
          sleep 2
          sid=$(head -1 ~/.cache/firn-redis-bench/session | cut -d' ' -f2)
          echo "sid=$sid" >> "$GITHUB_OUTPUT"
          cat ~/.cache/firn-redis-bench/session
          ps -s "$sid" -o pid,stat,args
          redis-cli -s ~/.cache/firn-redis-bench/probe.sock ping
          # As a cancelled run's leader ends with its job, leaving the server.
          kill -KILL "$sid"

  bench:
    needs: leftover
    uses: ./.github/workflows/redis-bench.yml
    with:
      runner: 14900k
      mode: compare
      revisions: "head=HEAD head-twin=HEAD"
      cpus: "1"
      tests: "set"
      depths: "16"
      passes: "1"
      seconds: "2"
      profile: false
      profile_test: "set 16"
      annotate: ""
      callers: false

  verify:
    needs: [leftover, bench]
    runs-on: [self-hosted, 14900k]
    steps:
      - run: |
          sid=${{ needs.leftover.outputs.sid }}
          if ps -s "$sid" -o pid= | grep -q .; then
            echo "the planted session $sid survived"
            ps -s "$sid" -o pid,args
            exit 1
          fi
          test ! -e ~/.cache/firn-redis-bench/session
          if redis-cli -s ~/.cache/firn-redis-bench/probe.sock ping > /dev/null 2>&1; then
            echo "the planted redis-server survived"
            exit 1
          fi
          rm -f ~/.cache/firn-redis-bench/probe.sock
          echo "the planted session $sid and its registered redis-server were stopped and no session file is left"
