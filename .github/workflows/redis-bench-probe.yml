# Temporary: checks redis-bench.yml's cleanup of a cancelled run's session on
# the 14900K and one small comparison; removed after it runs.
name: redis-bench-probe

on:
  push:
    branches: [claude/redis-bench]

jobs:
  leftover:
    runs-on: [self-hosted, 14900k]
    outputs:
      sid: ${{ steps.plant.outputs.sid }}
    steps:
      - id: plant
        run: |
          mkdir -p ~/.cache/firn-redis-bench
          RUNNER_TRACKING_ID= setsid sh -c 'echo $$ > ~/.cache/firn-redis-bench/session; exec sleep 900' > /dev/null 2>&1 &
          sleep 2
          sid=$(cat ~/.cache/firn-redis-bench/session)
          echo "sid=$sid" >> "$GITHUB_OUTPUT"
          ps -s "$sid" -o pid,args

  bench:
    needs: leftover
    uses: ./.github/workflows/redis-bench.yml
    with:
      runner: 14900k
      mode: compare
      revisions: "head=HEAD head-twin=HEAD"
      cpus: "1"
      tests: "set"
      depths: "16"
      passes: "1"
      seconds: "2"
      profile: false
      profile_test: "set 16"
      annotate: ""
      callers: false

  verify:
    needs: [leftover, bench]
    runs-on: [self-hosted, 14900k]
    steps:
      - run: |
          sid=${{ needs.leftover.outputs.sid }}
          if ps -s "$sid" -o pid= | grep -q .; then
            echo "the planted session $sid survived"
            exit 1
          fi
          test ! -e ~/.cache/firn-redis-bench/session
          echo "the planted session $sid was stopped and no session file is left"
