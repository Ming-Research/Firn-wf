# Temporary (firn-bullmq-wire): the BullMQ cells of the consumers workflow
# (Redis twice, firn once) and their comparison, run on every push of the
# branch to measure the time of each cell with the default file limit before
# the consumers workflow's timeout is set. Removed before the branch is ready.
name: tmp-bullmq

on:
  push:
    branches: [firn-bullmq-wire]

defaults:
  run:
    shell: bash

jobs:
  run:
    name: bullmq against ${{ matrix.server }}${{ matrix.repeat == 2 && ' (second run)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    strategy:
      fail-fast: false
      matrix:
        server: [redis, firn]
        repeat: [1]
        include:
          - server: redis
            repeat: 2
    steps:
      - uses: actions/checkout@v4

      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit deps/halo-wf

      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Put the reference Redis 7.2.16 on PATH
        run: |
          bin=$(tests/redis-suite/reference.sh)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/redis-server" --version

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Install the pinned release's LLVM
        if: ${{ matrix.server == 'firn' }}
        run: make toolchain

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # check-latest makes every cell take the newest Node 24 rather than the
      # one its runner image happens to hold, so that the two servers' cells
      # run the tests on the same Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true

      - name: Build firn
        if: ${{ matrix.server == 'firn' }}
        run: |
          make firn
          echo "FIRN=$GITHUB_WORKSPACE/build/firn" >> "$GITHUB_ENV"

      - name: Run BullMQ's tests
        env:
          OUT: ${{ runner.temp }}/consumers
        run: |
          start=$SECONDS
          bash research/experiments/consumers/run.sh bullmq "${{ matrix.server }}"
          echo "run.sh took $((SECONDS - start)) s"

      - name: Publish the result
        if: always()
        env:
          DIR: ${{ runner.temp }}/consumers/bullmq-${{ matrix.server }}
        run: |
          {
            echo "## bullmq against ${{ matrix.server }} (tmp)"
            echo '```text'
            cat "$DIR/what.txt" 2>/dev/null || true
            echo "tests exited $(cat "$DIR/status" 2>/dev/null || echo '(not run)')"
            echo "--- cases by status"
            cut -f2 "$DIR/cases.tsv" 2>/dev/null | sort | uniq -c || true
            echo "--- files by exit status"
            cut -f2 "$DIR/files.tsv" 2>/dev/null | sort | uniq -c || true
            echo "--- total seconds over files"
            awk -F'\t' '{s += $3} END {print s}' "$DIR/files.tsv" 2>/dev/null || true
            echo "--- slowest files (file, exit, seconds)"
            sort -t$'\t' -k3 -n -r "$DIR/files.tsv" 2>/dev/null | head -n 20 || true
            echo "--- unfinished rows"
            { grep -P '\tunfinished$' "$DIR/cases.tsv" 2>/dev/null || true; } | head -n 80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumers-bullmq-${{ matrix.server }}${{ matrix.repeat == 2 && '-2' || '' }}
          path: |
            ${{ runner.temp }}/consumers/bullmq-${{ matrix.server }}/*.txt
            ${{ runner.temp }}/consumers/bullmq-${{ matrix.server }}/*.log
            ${{ runner.temp }}/consumers/bullmq-${{ matrix.server }}/*.tsv
            ${{ runner.temp }}/consumers/bullmq-${{ matrix.server }}/status

  compare:
    name: bullmq on Redis against firn
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: consumers-bullmq-*
          path: ${{ runner.temp }}/bullmq

      - name: Compare the cases
        env:
          DIR: ${{ runner.temp }}/bullmq
        run: |
          python3 -B research/experiments/consumers/compare.py \
            --redis "$DIR/consumers-bullmq-redis/cases.tsv" \
            --redis "$DIR/consumers-bullmq-redis-2/cases.tsv" \
            --firn "$DIR/consumers-bullmq-firn/cases.tsv" \
            --redis-what "$DIR/consumers-bullmq-redis/what.txt" \
            --firn-what "$DIR/consumers-bullmq-firn/what.txt" \
            --unstable research/experiments/consumers/bullmq-unstable.tsv \
            --unstable-found "$DIR/unstable-found.tsv" \
            --title "BullMQ: Redis 7.2.16 against firn" > "$DIR/compare.md"
          cat "$DIR/compare.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-bullmq
          path: |
            ${{ runner.temp }}/bullmq/compare.md
            ${{ runner.temp }}/bullmq/unstable-found.tsv
