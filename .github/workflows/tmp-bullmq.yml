# Temporary (firn-bullmq-wire): BullMQ's tests against Redis alone, once with
# generous file limits to measure the time and the pass count before the
# consumers workflow's limits are set, and twice with very short limits to see
# the time bound act through the Vitest reporter. Removed before the branch is
# ready.
name: tmp-bullmq

on:
  push:
    branches: [firn-bullmq-wire]

defaults:
  run:
    shell: bash

jobs:
  redis:
    name: bullmq against redis, file limit ${{ matrix.limit }} s
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    strategy:
      fail-fast: false
      matrix:
        limit: [900, 2, 10]
    steps:
      - uses: actions/checkout@v4

      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit deps/halo-wf

      - name: Restore the Redis build
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - name: Put the reference Redis 7.2.16 on PATH
        run: |
          bin=$(tests/redis-suite/reference.sh)
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/redis-server" --version

      - name: Save the Redis build
        if: ${{ steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check the comparison script
        run: python3 -B research/experiments/consumers/compare.py --self-test

      - name: Run BullMQ's tests against Redis
        env:
          OUT: ${{ runner.temp }}/consumers
          FILE_LIMIT: ${{ matrix.limit }}
        run: |
          yarn --version
          start=$SECONDS
          bash research/experiments/consumers/run.sh bullmq redis
          echo "run.sh took $((SECONDS - start)) s"

      - name: Publish the result
        if: always()
        env:
          DIR: ${{ runner.temp }}/consumers/bullmq-redis
        run: |
          {
            echo "## bullmq against redis (tmp), file limit ${{ matrix.limit }} s"
            echo '```text'
            cat "$DIR/what.txt" 2>/dev/null || true
            echo "tests exited $(cat "$DIR/status" 2>/dev/null || echo '(not run)')"
            echo "--- cases by status"
            cut -f2 "$DIR/cases.tsv" 2>/dev/null | sort | uniq -c
            echo "--- files listed / files in files.tsv / files with a case row"
            wc -l < "$DIR/files-listed.txt" 2>/dev/null || true
            wc -l < "$DIR/files.tsv" 2>/dev/null || true
            grep '::' "$DIR/cases.tsv" 2>/dev/null | cut -d: -f1 | sort -u | wc -l
            echo "--- slowest files (file, exit, seconds)"
            sort -t$'\t' -k3 -n -r "$DIR/files.tsv" 2>/dev/null | head -n 20
            echo "--- total seconds over files"
            awk -F'\t' '{s += $3} END {print s}' "$DIR/files.tsv" 2>/dev/null
            echo "--- files by exit status"
            cut -f2 "$DIR/files.tsv" 2>/dev/null | sort | uniq -c
            echo "--- unfinished rows"
            grep -P '\tunfinished$' "$DIR/cases.tsv" 2>/dev/null | head -n 80
            echo "--- non-pass cases"
            grep -v -P '\tpass$' "$DIR/cases.tsv" 2>/dev/null | head -n 80
            echo "--- sizes of the run's files"
            ls -l "$DIR" 2>/dev/null
            echo "--- tail of test.log"
            tail -n 30 "$DIR/test.log" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-bullmq-redis-${{ matrix.limit }}
          path: |
            ${{ runner.temp }}/consumers/bullmq-redis/*.txt
            ${{ runner.temp }}/consumers/bullmq-redis/*.log
            ${{ runner.temp }}/consumers/bullmq-redis/*.tsv
            ${{ runner.temp }}/consumers/bullmq-redis/status
