# Temporary, board item firn-safety-witnesses: shows whether the pinned
# compiler still rejects the direct-field form of the Garnet ZTTL correction
# with OP-2, as the experiment README records for the earlier pin. The
# direct leg compiles the correction with the expiry field read in place;
# the control leg compiles the correction as committed. Delete before the PR
# is ready.
name: tmp-garnet-op2

on:
  push:
    branches: [claude/safety-witnesses]

jobs:
  garnet-op2:
    name: Garnet correction, direct field and control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check out Whitefoot-kit
        run: git submodule update --init whitefoot-kit
      - name: Download the pinned compiler
        run: make compiler
      - name: Install the pinned release's LLVM
        run: make toolchain
      - name: Compile the direct-field form and the committed form
        run: |
          compiler="$(printf 'print-compiler:\n\t@echo $(WHITEFOOTC)\n' | make -s -f Makefile -f - print-compiler)"
          echo "compiler: $compiler"
          cat whitefoot.pin
          dir=research/experiments/safety-witnesses/garnet-zttl
          mkdir -p "$RUNNER_TEMP/direct"
          # The correction with the field read where it is compared and
          # subtracted, and no local copy.
          sed -e '/let expires_at = sorted^.expires_at;/d' \
              -e 's/if expires_at <= now {/if sorted^.expires_at <= now {/' \
              -e 's/return expires_at - now;/return sorted^.expires_at - now;/' \
              "$dir/accepted.wf" > "$RUNNER_TEMP/direct/accepted.wf"
          diff "$dir/accepted.wf" "$RUNNER_TEMP/direct/accepted.wf" || true
          echo "== direct field form"
          "$compiler" --diagnostic-format json "$RUNNER_TEMP/direct/accepted.wf" -o "$RUNNER_TEMP/direct/out" && status=0 || status=$?
          echo "direct field form exit=$status"
          echo "== committed form (control)"
          "$compiler" --diagnostic-format json "$dir/accepted.wf" -o "$RUNNER_TEMP/committed" && status=0 || status=$?
          echo "committed form exit=$status"
