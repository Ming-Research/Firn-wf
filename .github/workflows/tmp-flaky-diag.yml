# Temporary (firn-rw-memory-tests-flaky): validates the two test fixes. Whole-suite
# legs run the gate's load with the fixed cases; the T1 legs run that case alone
# under injected disk contention, with the pre-fix case as the control.
# Removed with the item's last push.
name: tmp-flaky-diag

on:
  push:
    branches: [firn-rw-memory-tests-flaky]

concurrency:
  group: tmp-flaky-diag-${{ github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: t1-before-disk, tests: base, mode: alone, noise: disk, loops: 20, test: "rewrite_scan::reconciled_scan_long_history_completes_under_writes_without_duplicate_effects" }
          - { name: t1-after-disk, tests: fixed, mode: alone, noise: disk, loops: 60, test: "rewrite_scan::reconciled_scan_long_history_completes_under_writes_without_duplicate_effects" }
          - { name: t1-after-cpu, tests: fixed, mode: alone, noise: cpu, loops: 60, test: "rewrite_scan::reconciled_scan_long_history_completes_under_writes_without_duplicate_effects" }
          - { name: suite-a, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-b, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-c, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-d, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-e, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-f, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-g, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-h, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-i, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-j, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-k, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
          - { name: suite-l, tests: fixed, mode: suite, noise: none, loops: 11, test: "" }
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Use the pre-fix cases (control legs)
        if: matrix.tests == 'base'
        run: git checkout 9703783 -- tests/memory_limit.rs tests/rewrite_scan.rs
      - run: make compiler
      - run: make toolchain
      - run: rustup default stable && cargo --version
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - uses: actions/cache@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Build firn and the test binary
        run: |
          make firn-test
          redis_bin=$(tests/redis-suite/reference.sh)
          echo "REDIS_BIN=$redis_bin" >> "$GITHUB_ENV"
          FIRN=$PWD/build/firn-test REDIS_SERVER="$redis_bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --no-run
      - name: Loop
        env:
          NOISE: ${{ matrix.noise }}
          MODE: ${{ matrix.mode }}
          LOOPS: ${{ matrix.loops }}
          ONE: ${{ matrix.test }}
        run: |
          set +e
          export FIRN=$PWD/build/firn-test REDIS_SERVER="$REDIS_BIN/redis-server"
          mkdir -p "$RUNNER_TEMP/out"
          # Contention the gate's parallel cases put on the runner: two
          # writers that fsync large files in /tmp (where the cases keep
          # their files), or more busy loops than the runner has CPUs.
          if [ "$NOISE" = disk ]; then
            for n in 1 2; do
              ( while :; do dd if=/dev/zero of=/tmp/noise-$n.bin bs=1M count=600 conv=fsync status=none; done ) &
            done
          elif [ "$NOISE" = cpu ]; then
            for n in 1 2 3 4 5 6; do
              ( while :; do :; done ) &
            done
          fi
          for i in $(seq 1 "$LOOPS"); do
            log="$RUNNER_TEMP/out/loop-$i.log"
            start=$(date +%s.%N)
            if [ "$MODE" = suite ]; then
              cargo test --manifest-path tests/Cargo.toml --locked -- --skip rewrite_faults:: --show-output >"$log" 2>&1
            else
              cargo test --manifest-path tests/Cargo.toml --locked --test network -- --exact --nocapture --test-threads=1 "$ONE" >"$log" 2>&1
            fi
            status=$?
            end=$(date +%s.%N)
            echo "LOOP $i status=$status seconds=$(echo "$end - $start" | bc)"
            grep -o 'DIAG-[A-Za-z0-9-]* .*' "$log" | sed "s/^/  [loop $i] /"
            grep -E 'panicked at|FAILED' "$log" | grep -v -E 'reply_assertion_rejects|readiness_' | sed "s/^/  [loop $i] /" | cut -c1-300
          done
          kill $(jobs -p) 2>/dev/null
          echo "fails: $(grep -L 'test result: ok' $RUNNER_TEMP/out/loop-*.log | wc -l) of $LOOPS"
