# Temporary (firn-rw-memory-tests-flaky): measures the rewrite-memory cases
# alone under injected disk and CPU contention. Removed with the item's last push.
name: tmp-flaky-diag

on:
  push:
    branches: [firn-rw-memory-tests-flaky]

concurrency:
  group: tmp-flaky-diag-${{ github.sha }}
  cancel-in-progress: false

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unknown-boundary-tmpfs, mode: alone, noise: none, extra: "--ignored", loops: 40, test: "rewrite_scan::diag_long_history_unknown_boundary_on_tmpfs" }
          - { name: unknown-boundary-disk, mode: alone, noise: none, extra: "--ignored", loops: 40, test: "rewrite_scan::diag_long_history_unknown_boundary_on_disk" }
          - { name: continuous-16k, mode: alone, noise: none, extra: "--ignored", loops: 40, test: "memory_limit::diag_cache_at_limit_continuous_writes_16k" }
          - { name: continuous-1k, mode: alone, noise: none, extra: "--ignored", loops: 40, test: "memory_limit::diag_cache_at_limit_continuous_writes_1k" }
          - { name: suite-a, mode: suite, noise: none, extra: "", loops: 12, test: "" }
          - { name: suite-b, mode: suite, noise: none, extra: "", loops: 12, test: "" }
          - { name: suite-c, mode: suite, noise: none, extra: "", loops: 12, test: "" }
          - { name: suite-d, mode: suite, noise: none, extra: "", loops: 12, test: "" }
          - { name: suite-e, mode: suite, noise: none, extra: "", loops: 12, test: "" }
          - { name: suite-f, mode: suite, noise: none, extra: "", loops: 12, test: "" }
    env:
      REDIS_COMPAT_CACHE: ${{ github.workspace }}/build/redis-compat-cache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make compiler
      - run: make toolchain
      - run: rustup default stable && cargo --version
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - uses: actions/cache@v4
        with:
          path: build/redis-compat-cache
          key: redis-reference-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/redis-suite/reference.sh') }}
      - name: Build firn and the test binary
        run: |
          make firn-test
          redis_bin=$(tests/redis-suite/reference.sh)
          echo "REDIS_BIN=$redis_bin" >> "$GITHUB_ENV"
          FIRN=$PWD/build/firn-test REDIS_SERVER="$redis_bin/redis-server" \
            cargo test --manifest-path tests/Cargo.toml --locked --no-run
      - name: Loop
        env:
          NOISE: ${{ matrix.noise }}
          MODE: ${{ matrix.mode }}
          EXTRA: ${{ matrix.extra }}
          LOOPS: ${{ matrix.loops }}
          ONE: ${{ matrix.test }}
        run: |
          set +e
          export FIRN=$PWD/build/firn-test REDIS_SERVER="$REDIS_BIN/redis-server"
          mkdir -p "$RUNNER_TEMP/out"
          # Contention the gate's parallel cases put on the runner: two
          # writers that fsync large files in /tmp (where the cases keep
          # their files), or more busy loops than the runner has CPUs.
          if [ "$NOISE" = disk ]; then
            for n in 1 2; do
              ( while :; do dd if=/dev/zero of=/tmp/noise-$n.bin bs=1M count=600 conv=fsync status=none; done ) &
            done
          elif [ "$NOISE" = cpu ]; then
            for n in 1 2 3 4 5 6; do
              ( while :; do :; done ) &
            done
          fi
          for i in $(seq 1 "$LOOPS"); do
            log="$RUNNER_TEMP/out/loop-$i.log"
            start=$(date +%s.%N)
            if [ "$MODE" = suite ]; then
              cargo test --manifest-path tests/Cargo.toml --locked -- --skip rewrite_faults:: --show-output >"$log" 2>&1
            else
              cargo test --manifest-path tests/Cargo.toml --locked --test network -- $EXTRA --exact --nocapture --test-threads=1 "$ONE" >"$log" 2>&1
            fi
            status=$?
            end=$(date +%s.%N)
            echo "LOOP $i status=$status seconds=$(echo "$end - $start" | bc)"
            grep -o 'DIAG-[A-Za-z0-9-]* .*' "$log" | sed "s/^/  [loop $i] /"
            grep -E 'panicked at|FAILED' "$log" | grep -v -E 'reply_assertion_rejects|readiness_' | sed "s/^/  [loop $i] /" | cut -c1-300
          done
          kill $(jobs -p) 2>/dev/null
          echo "fails: $(grep -L 'test result: ok' $RUNNER_TEMP/out/loop-*.log | wc -l) of $LOOPS"
