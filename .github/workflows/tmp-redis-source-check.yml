# Temporary: reads the Redis 7.2.16 functions that the research record cites
# (research/investigations/aof-rewrite/scan-log.md, "Rewrite at the cache
# limit") out of the pinned release archive, so that the claims have a CI run.
# Removed before the branch is ready (item firn-rw-cache-refused).
name: tmp-redis-source-check

on:
  push:
    branches: [claude/rw-under-maxmemory]
  workflow_dispatch:

jobs:
  source:
    name: cited Redis 7.2.16 functions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The pinned archive holds what the record cites
        run: |
          archive=$(REDIS_COMPAT_CACHE="$RUNNER_TEMP/redis-cache" tests/redis-suite/reference.sh archive)
          src=$(mktemp -d)
          tar -xzf "$archive" -C "$src" \
            redis-7.2.16/src/evict.c redis-7.2.16/src/aof.c \
            redis-7.2.16/src/zmalloc.c redis-7.2.16/src/server.c
          cd "$src/redis-7.2.16/src"
          require() { grep -nF -- "$2" "$1" || { echo "::error::$1 lacks: $2"; exit 1; }; }
          require evict.c 'size_t freeMemoryGetNotCountedMemory(void) {'
          require evict.c 'overhead += sdsAllocSize(server.aof_buf);'
          require evict.c 'int getMaxmemoryState('
          require evict.c 'size_t overhead = freeMemoryGetNotCountedMemory();'
          require aof.c 'int rewriteAppendOnlyFileBackground(void) {'
          require aof.c 'if (openNewIncrAofForAppend() != C_OK) {'
          require aof.c 'redisFork(CHILD_TYPE_AOF)'
          require aof.c 'void bgrewriteaofCommand(client *c) {'
          require aof.c 'addReplyStatus(c,"Background append only file rewriting started");'
          require zmalloc.c 'static redisAtomic size_t used_memory = 0;'
          require server.c 'int redisFork(int purpose) {'
          if grep -n 'aof_rewrite_buf' aof.c; then
            echo "::error::aof.c names a rewrite-difference buffer"
            exit 1
          fi
          echo "---- rewriteAppendOnlyFileBackground, up to the fork"
          sed -n '/^int rewriteAppendOnlyFileBackground/,/redisFork(CHILD_TYPE_AOF)/p' aof.c
          echo "---- redisFork"
          sed -n '/^int redisFork(int purpose) {/,/^}/p' server.c
